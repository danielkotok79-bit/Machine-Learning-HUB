name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apps:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [Supervised, Clustering, NLP, Deeplearning]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/${{ matrix.app }}/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q

  launcher:
    name: Launcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Smoke test (EN, PL, DE)
        run: |
          python - <<'EOF'
          from streamlit.testing.v1 import AppTest

          for lang in ("en", "pl", "de"):
              at = AppTest.from_file("app.py", default_timeout=60)
              at.query_params["lang"] = lang
              at.run()
              assert not at.exception, (lang, at.exception)
              print(lang, "OK")
          EOF
